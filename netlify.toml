[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Set this in Netlify UI → Site → Environment variables
  # VITE_API_URL  = "https://your-backend.onrender.com/api"
  # VITE_ASSETS_URL = "https://your-backend.onrender.com/assets"
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
